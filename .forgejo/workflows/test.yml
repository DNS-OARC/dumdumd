name: test
on: pull_request
jobs:
  test:
    runs-on: docker
    steps:
    - uses: actions/checkout@v4
    - name: install dependencies
      run: |
        apt-get update
        apt-get install -y libev-dev libuv1-dev libssl-dev libevent-dev libnghttp2-dev
    - name: configure
      run: sh autogen.sh && mkdir -p build && cd build && ../configure --enable-warn-all
    - name: make
      run: cd build && make clean all test
